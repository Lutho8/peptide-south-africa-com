name: EFT sandbox contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eft-sandbox.yml"
      - "scripts/ci/eft-sandbox-contract.mjs"
      - "supabase/config.toml"
      - "supabase/functions/_shared/pricing.ts"
      - "supabase/functions/eft-create-order/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/eft-sandbox.yml"
      - "scripts/ci/eft-sandbox-contract.mjs"
      - "supabase/config.toml"
      - "supabase/functions/_shared/pricing.ts"
      - "supabase/functions/eft-create-order/**"

permissions:
  contents: read

concurrency:
  group: eft-sandbox-contract
  cancel-in-progress: false

jobs:
  deploy-and-contract:
    name: Deploy native EFT function and verify authenticated contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: eft-sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate managed sandbox credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          EFT_SANDBOX_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EFT_SANDBOX_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EFT_SANDBOX_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing eft-sandbox secret SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_PROJECT_ID:?Missing eft-sandbox secret SUPABASE_PROJECT_ID}"
          : "${EFT_SANDBOX_SUPABASE_URL:?Missing eft-sandbox secret SUPABASE_URL}"
          : "${EFT_SANDBOX_PUBLISHABLE_KEY:?Missing eft-sandbox secret SUPABASE_PUBLISHABLE_KEY}"
          : "${EFT_SANDBOX_SERVICE_ROLE_KEY:?Missing eft-sandbox secret SUPABASE_SERVICE_ROLE_KEY}"

      - name: Install application dependencies
        run: npm ci

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.115.0

      - name: Configure synthetic EFT bank details
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          EFT_ACCOUNT_NAME: PSA CI Sandbox
          EFT_ACCOUNT_NUMBER: "0000000000"
          EFT_BRANCH_CODE: "000000"
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            EFT_ACCOUNT_NAME="$EFT_ACCOUNT_NAME" \
            EFT_ACCOUNT_NUMBER="$EFT_ACCOUNT_NUMBER" \
            EFT_BRANCH_CODE="$EFT_BRANCH_CODE"

      - name: Deploy native EFT order function to sandbox
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy eft-create-order --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Run authenticated EFT sandbox contract
        env:
          EFT_SANDBOX_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EFT_SANDBOX_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EFT_SANDBOX_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/eft-sandbox-contract.mjs

name: EFT sandbox contract

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/eft-sandbox.yml"
      - "api/eft-create-order.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci/eft-sandbox-contract.mjs"
      - "scripts/ci/verify-declarative-baseline.mjs"
      - "supabase/config.toml"
      - "supabase/schemas/**"
      - "supabase/roles.sql"
      - "supabase/migrations/**"
      - "supabase/functions/_shared/pricing.ts"
      - "supabase/functions/eft-create-order/**"
      - "supabase/functions/eft-reconcile/**"
      - "supabase/functions/_shared/metaCapi.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/eft-sandbox.yml"
      - "api/eft-create-order.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/ci/eft-sandbox-contract.mjs"
      - "scripts/ci/verify-declarative-baseline.mjs"
      - "supabase/config.toml"
      - "supabase/schemas/**"
      - "supabase/roles.sql"
      - "supabase/migrations/**"
      - "supabase/functions/_shared/pricing.ts"
      - "supabase/functions/eft-create-order/**"
      - "supabase/functions/eft-reconcile/**"
      - "supabase/functions/_shared/metaCapi.ts"

permissions:
  contents: read

concurrency:
  group: eft-sandbox-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contract:
    name: Verify EFT contract from declarative production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.117.0

      - name: Verify declarative production baseline
        run: node scripts/ci/verify-declarative-baseline.mjs

      - name: Require schema and migration changes together
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$DIFF_BASE:supabase/schemas/.pgdelta-export.json" 2>/dev/null; then
            changed="$(git diff --name-only "$DIFF_BASE" "${{ github.sha }}")"
            migrations_changed="$(printf '%s\n' "$changed" | grep -c '^supabase/migrations/' || true)"
            schemas_changed="$(printf '%s\n' "$changed" | grep -Ec '^supabase/(schemas/|roles\.sql$)' || true)"
            if { [ "$migrations_changed" -gt 0 ] && [ "$schemas_changed" -eq 0 ]; } || \
               { [ "$schemas_changed" -gt 0 ] && [ "$migrations_changed" -eq 0 ]; }; then
              echo "Schema drift guard: change supabase/schemas and supabase/migrations together." >&2
              exit 1
            fi
          fi

      - name: Build a clean migration from the declarative baseline
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const configPath = "supabase/config.toml";
          const config = fs.readFileSync(configPath, "utf8");
          if (!/^project_id = "eutszmrsukoqqeilzrbv"$/m.test(config)) {
            throw new Error("Refusing to rewrite an unexpected Supabase project_id");
          }
          fs.writeFileSync(
            configPath,
            config.replace(
              /^project_id = "eutszmrsukoqqeilzrbv"$/m,
              'project_id = "eft-declarative-sandbox-ci"',
            ),
          );
          NODE

          mv supabase/migrations "$RUNNER_TEMP/production-migrations"
          mkdir supabase/migrations
          supabase db schema declarative sync \
            --experimental \
            --strict-coverage \
            --no-apply \
            --name ci_declarative_production_baseline

          generated_count="$(find supabase/migrations -maxdepth 1 -type f -name '*_ci_declarative_production_baseline.sql' | wc -l)"
          if [ "$generated_count" -ne 1 ]; then
            echo "Expected exactly one generated baseline migration, found $generated_count" >&2
            exit 1
          fi

      - name: Start isolated local Supabase from baseline
        run: supabase start

      - name: Export ephemeral local credentials
        shell: bash
        run: |
          status_file="$RUNNER_TEMP/supabase-status.env"
          supabase status -o env > "$status_file"
          chmod 600 "$status_file"
          set -a
          source "$status_file"
          set +a

          : "${API_URL:?Local Supabase API URL was not reported}"
          : "${ANON_KEY:?Local Supabase anon key was not reported}"
          : "${SERVICE_ROLE_KEY:?Local Supabase service role key was not reported}"

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            printf 'EFT_SANDBOX_SUPABASE_URL=%s\n' "$API_URL"
            printf 'EFT_SANDBOX_PUBLISHABLE_KEY=%s\n' "$ANON_KEY"
            printf 'EFT_SANDBOX_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'SUPABASE_URL=%s\n' "$API_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'CHECKOUT_STORE_SECRET=%s\n' 'eft-ci-approved-storefront-secret'
          } >> "$GITHUB_ENV"

      - name: Serve the native EFT functions locally
        shell: bash
        run: |
          env_file="$RUNNER_TEMP/eft-ci.env"
          printf '%s\n' \
            'EFT_ACCOUNT_NAME=PSA CI Sandbox' \
            'EFT_ACCOUNT_NUMBER=0000000000' \
            'EFT_BRANCH_CODE=000000' \
            'CHECKOUT_STORE_SECRET=eft-ci-approved-storefront-secret' \
            'EFT_RECONCILE_SECRET=eft-ci-reconcile-secret' > "$env_file"
          chmod 600 "$env_file"

          nohup supabase functions serve eft-create-order --env-file "$env_file" \
            > "$RUNNER_TEMP/eft-function.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/eft-function.pid"

          for attempt in {1..60}; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header "apikey: $EFT_SANDBOX_PUBLISHABLE_KEY" \
              --header 'x-checkout-store-secret: eft-ci-approved-storefront-secret' \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$EFT_SANDBOX_SUPABASE_URL/functions/v1/eft-create-order" || true)"
            if [ "$status" = "401" ]; then
              break
            fi
            sleep 1
          done
          if [ "$status" != "401" ]; then
            sed -n '1,200p' "$RUNNER_TEMP/eft-function.log"
            echo "Local EFT create-order auth gate returned $status instead of 401" >&2
            exit 1
          fi

          for attempt in {1..60}; do
            reconcile_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header "apikey: $EFT_SANDBOX_PUBLISHABLE_KEY" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$EFT_SANDBOX_SUPABASE_URL/functions/v1/eft-reconcile" || true)"
            if [ "$reconcile_status" = "401" ]; then
              break
            fi
            sleep 1
          done
          if [ "$reconcile_status" != "401" ]; then
            sed -n '1,200p' "$RUNNER_TEMP/eft-function.log"
            echo "Local EFT reconciler auth gate returned $reconcile_status instead of 401" >&2
            exit 1
          fi

      - name: Install pinned Cloudflare tunnel client
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.9.0/cloudflared-linux-amd64
          printf '%s  %s\n' \
            '53b7a7a5420d188758d24341294acb0d1bca54296548ac05e38811a694ac6134' \
            "$RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/cloudflared"

      - name: Expose the disposable Supabase API to the canary deployment
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          nohup "$RUNNER_TEMP/cloudflared" tunnel --url "$EFT_SANDBOX_SUPABASE_URL" --no-autoupdate \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cloudflared.pid"

          tunnel_url=''
          for attempt in {1..60}; do
            tunnel_url="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)"
            if [ -n "$tunnel_url" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$tunnel_url" ]; then
            sed -n '1,160p' "$RUNNER_TEMP/cloudflared.log"
            echo 'Disposable Supabase tunnel did not become ready' >&2
            exit 1
          fi

          for attempt in {1..30}; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$tunnel_url/auth/v1/health" || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            echo "Disposable Supabase tunnel health returned $status" >&2
            exit 1
          fi
          echo "EFT_CANARY_SUPABASE_URL=$tunnel_url" >> "$GITHUB_ENV"

      - name: Deploy disposable Vercel checkout canary
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN repository secret}"
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID repository variable}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID repository variable}"

          canary_url="$(npx --yes vercel@59.16.0 deploy . \
            --yes \
            --project "$VERCEL_PROJECT_ID" \
            --env "SUPABASE_URL=$EFT_CANARY_SUPABASE_URL" \
            --env "SUPABASE_ANON_KEY=$EFT_SANDBOX_PUBLISHABLE_KEY" \
            --env "SUPABASE_SERVICE_ROLE_KEY=$EFT_SANDBOX_SERVICE_ROLE_KEY" \
            --env 'CHECKOUT_STORE_SECRET=eft-ci-approved-storefront-secret' \
            --build-env "VITE_SUPABASE_URL=$EFT_CANARY_SUPABASE_URL" \
            --build-env "VITE_SUPABASE_PUBLISHABLE_KEY=$EFT_SANDBOX_PUBLISHABLE_KEY" \
            --build-env 'VITE_SUPABASE_PROJECT_ID=eft-declarative-sandbox-ci')"
          if ! [[ "$canary_url" =~ ^https:// ]]; then
            echo 'Vercel canary deployment did not return an HTTPS URL' >&2
            exit 1
          fi
          {
            echo "EFT_SANDBOX_STOREFRONT_URL=$canary_url"
            echo "EFT_CANARY_DEPLOYMENT_URL=$canary_url"
          } >> "$GITHUB_ENV"

          canary_id="$(npx --yes vercel@59.16.0 inspect "$canary_url" --json | node -e \
            "let input='';process.stdin.on('data',chunk=>input+=chunk).on('end',()=>process.stdout.write(JSON.parse(input).id||''));")"
          if ! [[ "$canary_id" =~ ^dpl_ ]]; then
            echo 'Vercel canary deployment did not return a deployment ID' >&2
            exit 1
          fi
          echo "EFT_CANARY_DEPLOYMENT_ID=$canary_id" >> "$GITHUB_ENV"

      - name: Run authenticated EFT sandbox contract
        env:
          EFT_SANDBOX_CHECKOUT_STORE_SECRET: eft-ci-approved-storefront-secret
          EFT_SANDBOX_RECONCILE_SECRET: eft-ci-reconcile-secret
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx vite-node scripts/ci/eft-sandbox-contract.mjs

      - name: Show local function logs on failure
        if: failure()
        shell: bash
        run: sed -n '1,240p' "$RUNNER_TEMP/eft-function.log" || true

      - name: Tear down the isolated Supabase stack
        if: always()
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          canary_deployment="${EFT_CANARY_DEPLOYMENT_ID:-${EFT_CANARY_DEPLOYMENT_URL:-}}"
          if [ -n "$canary_deployment" ] && [ -n "${VERCEL_TOKEN:-}" ]; then
            npx --yes vercel@59.16.0 remove "$canary_deployment" \
              --yes || true
          fi
          if [ -f "$RUNNER_TEMP/cloudflared.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/eft-function.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/eft-function.pid")" 2>/dev/null || true
          fi
          supabase stop --no-backup

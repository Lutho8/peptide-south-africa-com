name: Catalogue release verification
on:
  push:
    branches: [main, fix/sa-stock-pack-checkout-20260927]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: catalogue-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.api.json
      - name: All unit tests
        run: npm test 2>&1 | tee /tmp/catalogue-unit-tests.log
      - name: Build without production side effects
        run: npm run build 2>&1 | tee /tmp/catalogue-build.log
      - name: Verify native Vercel API compilation without deployment
        env:
          VERCEL_TELEMETRY_DISABLED: 1
        run: |
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('.vercel/project.json', JSON.stringify({projectId:'prj_5BvjL0zY2hVAdlhpJ9DXYedY9MsQ',orgId:'team_JzyUL68zQD7Lo7gKWPiWxar7',projectName:'peptide-south-africa-com',settings:{framework:'vite',buildCommand:'npm run build',outputDirectory:'dist',installCommand:'npm ci',nodeVersion:'22.x',rootDirectory:null}}));
          writeFileSync('.vercel/.env.preview.local', 'VERCEL_ENV=preview\n');
          NODE
          npx --yes vercel@59.16.0 build --no-color 2>&1 | tee /tmp/catalogue-vercel-build.log
          if grep -Eq 'error TS[0-9]+:' /tmp/catalogue-vercel-build.log; then
            echo 'Vercel emitted TypeScript diagnostics; release blocked.'
            exit 1
          fi
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile read-only browser verification
        env:
          CATALOGUE_TEST_OUTPUT: /tmp/psa-browser-results
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/catalogue-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/catalogue-release.json >/dev/null && break || sleep 1; done
          node scripts/catalogue-browser-smoke.mjs 2>&1 | tee /tmp/catalogue-browser.log
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-release-evidence
          path: |
            /tmp/catalogue-unit-tests.log
            /tmp/catalogue-build.log
            /tmp/catalogue-vercel-build.log
            /tmp/catalogue-browser.log
            /tmp/catalogue-preview.log
            /tmp/psa-browser-results/
          retention-days: 14
  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the catalogue release on the production domain
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "https://www.peptide-south-africa.com/catalogue-release.json?verify=${GITHUB_SHA}" | grep -q 'psa-sa-stock-2026-09-27'; then exit 0; fi
            sleep 10
          done
          echo 'Production did not serve the expected release within ten minutes.'
          exit 1
      - name: Live desktop and mobile verification without orders or notifications
        env:
          CATALOGUE_TEST_URL: https://www.peptide-south-africa.com
          CATALOGUE_TEST_OUTPUT: /tmp/psa-production-results
        run: node scripts/catalogue-browser-smoke.mjs 2>&1 | tee /tmp/catalogue-production.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-production-evidence
          path: |
            /tmp/catalogue-production.log
            /tmp/psa-production-results/
          retention-days: 14

    <style>

      h1 { margin: .25rem 0 .75rem; font-size: clamp(2rem, 8vw, 3.5rem); }
      p { margin: 0 auto 1.75rem; max-width: 32rem; color: #465b6f; line-height: 1.6; }
      a { display: inline-block; padding: .8rem 1.15rem; border-radius: .75rem; background: #00d4aa; color: #0a2540; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0a2540; outline-offset: 3px; }
    </style>
